plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = "1.0.0-26.1.2"
group = 'dev.anclyakeks.compat.mcfd'

base {
    archivesName = 'mcfd_compat'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    // Флотские порты MineColonies/Structurize/BlockUI публикуются в mavenLocal (com.ldtteam).
    mavenLocal()
}

def forks = file("${projectDir}/../..").absolutePath

neoForge {
    version = project.neo_version

    runs {
        server {
            server()
            programArgument '--nogui'
            gameDirectory = project.file('run/server')
        }
        client {
            client()
            gameDirectory = project.file('run')
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
            // QA: экспорт transformed-классов (.mixin.out) для проверки применения миксинов.
            systemProperty 'mixin.debug.export', 'true'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    def m2 = "${System.properties['user.home']}/.m2/repository"
    // MineColonies (GPL-3.0): локальный jar (mavenLocal / дерево MineColonies),
    // files() без транзитивности POM — флотский паттерн MineColonies_Compatibility.
    implementation files(findProperty('minecolonies_jar')
        ?: "${m2}/com/ldtteam/minecolonies/${minecolonies_version}/minecolonies-${minecolonies_version}.jar")
    // Рантайм-стек MineColonies: его neoforge.mods.toml требует их как required-моды
    // (класспас-дискавери FML в dev-ранах moddev — WriteLegacyClasspath).
    compileOnly files(
        "${m2}/com/ldtteam/structurize/${structurize_version}/structurize-${structurize_version}.jar",
        "${m2}/com/ldtteam/blockui/${blockui_version}/blockui-${blockui_version}.jar"
    )
    runtimeOnly files(
        "${m2}/com/ldtteam/structurize/${structurize_version}/structurize-${structurize_version}.jar",
        "${m2}/com/ldtteam/blockui/${blockui_version}/blockui-${blockui_version}.jar",
        "${m2}/com/ldtteam/domum-ornamentum/1.0.0-local/domum-ornamentum-1.0.0-local-main.jar",
        "${m2}/com/ldtteam/multipiston/0.0.1-26.1.2/multipiston-0.0.1-26.1.2.jar"
    )
    // Farmer's Delight 26.1.2 порт (MIT): собранный jar нашего дерева worktrees/farmersdelight-26.1.2.
    implementation files(findProperty('farmersdelight_jar') ?: "${forks}/worktrees/farmersdelight-26.1.2/build/libs/FarmersDelight-Neoforged-MC26.1.2-FD1.3.4-2.jar")
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '5000']
    options.fork = true
    options.forkOptions.jvmArgs += ['-Duser.language=en', '-Duser.country=US']
}
